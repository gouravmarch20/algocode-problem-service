name: Leetcode Problem Service CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to server & restart PM2
        run: |
          # Go to the deployment directory on your server
          cd ~/leetcode-problem-service

          # Make sure you are on main and pull latest code
          git fetch origin main
          git reset --hard origin/main

          # Install dependencies
          npm ci

          # Restart or start PM2 process
          pm2 describe leetcode-problem-service > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            pm2 reload leetcode-problem-service
          else
            pm2 start src/index.js --name leetcode-problem-service
          fi

          # Save PM2 process list to startup
          pm2 save
